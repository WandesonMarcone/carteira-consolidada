name: Validar painel do investidor
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < assets/app.js
      - run: node --input-type=module --check < assets/workspace.js
      - run: python3 -m unittest discover -s tests -v
